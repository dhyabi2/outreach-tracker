name: track

on:
  schedule:
    # Four times a day. The table is a mirror of GitHub, so a stale row is a wrong row.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Laws
        run: python3 -m unittest discover -s tests -t . -v

      - name: Rebuild the table
        env:
          # The default token is enough for the public search API and can only write this repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 track.py

      - name: Commit if the table changed
        run: |
          git config user.name "outreach-tracker"
          git config user.email "noreply@github.com"
          git add README.md data.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "track: rebuild the outreach table"
          git push
